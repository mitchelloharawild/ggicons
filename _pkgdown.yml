url: https://pkg.mitchelloharawild.com/ggicons/
template:
  bootstrap: 5

reference:
- title: Geom
  desc: Draw icons as a plot layer.
  contents:
  - geom_icon
  - geom_pictogram
  - stat_pictogram
- title: Scales
  desc: Map icon data to the `icon` aesthetic, and the pictogram `value` aesthetic.
  contents:
  - scale_icon_identity
  - scale_icon_manual
  - scale_value_continuous
- title: Guides
  desc: Legends for icon layers.
  contents:
  - draw_key_icon
  - guide_pictogram
- title: Annotations
  desc: Add a fixed-position icon to a plot.
  contents:
  - annotation_icon
- title: Theme
  desc: Draw axis, strip and legend labels as icons.
  contents:
  - element_icon

