# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown.yaml

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    # Only restrict concurrency for non-PR jobs
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Determine icon pack cache path
        id: icon-cache
        run: echo "path=$(Rscript -e 'cat(rappdirs::user_data_dir("rpkg_icon"))')" >> "$GITHUB_OUTPUT"

      - name: Cache downloaded icon packs
        uses: actions/cache@v4
        with:
          path: ${{ steps.icon-cache.outputs.path }}
          key: icons-fontawesome-${{ runner.os }}

      # Some reference examples are gated behind icons::icon_installed(icons::fontawesome)
      # (@examplesIf) so they don't fail where Font Awesome hasn't been downloaded; fetch it
      # here so pkgdown's example run renders them on the site.
      - name: Download Font Awesome icon pack
        run: |
          Rscript -e 'if (!icons::icon_installed(icons::fontawesome)) icons::download_fontawesome()'

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy to GitHub pages 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          clean: false
          branch: gh-pages
          folder: docs
